<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#6B8DD6"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="To-Do List"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" type="image/png" sizes="32x32" href="favicon.ico"/>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"/>
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png"/>
<link rel="apple-touch-icon" sizes="144x144" href="icon-144.png"/>
<title>To-Do List</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700&family=Caveat:wght@600&display=swap" rel="stylesheet"/>
<style>
:root {
  --primary: #6B8DD6;
  --primary-light: #E8EEF9;
  --primary-dark: #4A6BC4;
  --bg: #F0F4F8;
  --surface: #ffffff;
  --text: #1A1A2E;
  --text-sec: #7A88A0;
  --text-light: #B8C4D0;
  --border: #E4EAF0;
  --red: #E05C5C;
  --yellow: #F5B731;
  --green: #3AB795;
  --orange: #F08A3C;
  --purple: #9B6DD6;
  --teal: #3ABFBF;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-full: 999px;
  --shadow-sm: 0 1px 6px rgba(0,0,0,.06);
  --shadow-md: 0 4px 16px rgba(0,0,0,.10);
  --font: 'Nunito', sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--text);}
#app{height:100%;display:flex;flex-direction:column;padding-top:var(--safe-top);}

/* ─── SCREENS ─── */
.screen{display:none;flex:1;flex-direction:column;overflow:hidden;}
.screen.active{display:flex;}

/* ─── HEADER ─── */
.top-bar{display:flex;align-items:center;padding:14px 16px 10px;background:var(--bg);gap:8px;flex-shrink:0;}
.top-bar h1{font-size:18px;font-weight:800;flex:1;}
.icon-btn{background:none;border:none;cursor:pointer;padding:6px;font-size:20px;color:var(--text);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;}
.icon-btn:active{background:var(--primary-light);}
.back-btn{font-size:22px;color:var(--text);background:none;border:none;cursor:pointer;padding:4px 8px 4px 0;}

/* ─── CHIP TABS ─── */
.chips{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;flex-shrink:0;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{padding:7px 16px;border-radius:var(--radius-full);background:var(--primary-light);border:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--text);font-family:var(--font);white-space:nowrap;transition:all .15s;}
.chip.active{background:var(--primary);color:#fff;}

/* ─── TASK LIST ─── */
.task-list{flex:1;overflow-y:auto;padding:4px 0;overscroll-behavior:contain;}
.task-list::-webkit-scrollbar{display:none;}
.section-label{display:flex;align-items:center;gap:8px;padding:8px 16px;cursor:pointer;}
.section-label span{font-size:14px;font-weight:700;flex:1;}
.section-label .chevron{font-size:11px;color:var(--text-sec);}
.task-item{display:flex;align-items:center;background:var(--surface);margin:0 16px 8px;border-radius:var(--radius-md);padding:12px 14px;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .1s;}
.task-item:active{transform:scale(.98);}
.task-item.completed{opacity:.6;}
.task-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--text-light);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all .2s;}
.task-check.done{background:var(--text-light);border-color:var(--text-light);color:#fff;font-size:13px;}
.task-body{flex:1;margin:0 10px;}
.task-title{font-size:15px;font-weight:600;}
.task-item.completed .task-title{text-decoration:line-through;color:var(--text-sec);}
.task-due{font-size:12px;color:var(--text-sec);margin-top:2px;}
.task-flag{font-size:18px;color:var(--border);cursor:pointer;}
.task-flag.flagged{color:var(--red);}

/* select mode */
.task-cb{width:22px;height:22px;border-radius:6px;border:2px solid var(--text-light);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;}
.task-cb.checked{background:var(--primary);border-color:var(--primary);color:#fff;font-size:12px;}

/* ─── EMPTY STATE ─── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:40px 30px;text-align:center;}
.empty-emoji{font-size:72px;margin-bottom:20px;}
.empty-title{font-size:17px;font-weight:700;margin-bottom:8px;}
.empty-sub{font-size:14px;color:var(--text-sec);line-height:1.6;}

/* ─── FAB ─── */
.fab{position:absolute;bottom:calc(80px + var(--safe-bottom));right:20px;width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;font-size:32px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-md);border:none;cursor:pointer;z-index:10;font-weight:300;transition:transform .15s;}
.fab:active{transform:scale(.93);}

/* ─── BOTTOM NAV ─── */
.bottom-nav{display:flex;background:var(--surface);border-top:1px solid var(--border);padding-bottom:var(--safe-bottom);flex-shrink:0;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 0 6px;cursor:pointer;border:none;background:none;font-family:var(--font);color:var(--text-sec);font-size:11px;gap:3px;font-weight:600;transition:color .15s;}
.nav-btn.active{color:var(--primary);}
.nav-icon{font-size:22px;line-height:1;}
.nav-dot{position:relative;}
.nav-dot::after{content:'';position:absolute;top:-2px;right:-4px;width:7px;height:7px;background:var(--red);border-radius:50%;}

/* ─── DRAWER ─── */
#drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0);display:none;z-index:100;transition:background .25s;}
#drawer-overlay.open{display:block;background:rgba(0,0,0,.4);}
#drawer{position:fixed;top:0;left:-82%;bottom:0;width:80%;max-width:320px;background:var(--surface);z-index:101;display:flex;flex-direction:column;transform:translateX(0);transition:left .25s cubic-bezier(.4,0,.2,1);overflow:hidden;}
#drawer.open{left:0;}
.drawer-header{background:var(--primary);padding:calc(50px + var(--safe-top)) 20px 20px;position:relative;overflow:hidden;}
.drawer-header::before{content:'';position:absolute;top:-30px;right:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.1);}
.drawer-app-title{font-family:'Caveat',cursive;font-size:30px;color:#fff;font-weight:600;}
.drawer-body{flex:1;overflow-y:auto;}
.drawer-item{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--border);cursor:pointer;font-size:15px;font-weight:600;}
.drawer-item:active{background:var(--primary-light);}
.drawer-item .di-icon{font-size:19px;width:26px;text-align:center;}
.drawer-item .di-count{margin-left:auto;color:var(--text-sec);font-size:14px;}
.drawer-cat-header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--bg);font-size:13px;font-weight:700;color:var(--text-sec);text-transform:uppercase;letter-spacing:.5px;}

/* ─── OVERFLOW MENU ─── */
#overflow-menu{position:fixed;top:60px;right:12px;background:var(--surface);border-radius:var(--radius-md);box-shadow:var(--shadow-md);z-index:50;min-width:200px;display:none;overflow:hidden;}
#overflow-menu.open{display:block;}
.menu-item{padding:14px 20px;font-size:15px;cursor:pointer;font-weight:600;border-bottom:1px solid var(--border);}
.menu-item:last-child{border:none;}
.menu-item:active{background:var(--primary-light);}

/* ─── MODALS ─── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal-sheet{background:var(--surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0;width:100%;max-height:85vh;overflow-y:auto;padding:24px 20px calc(24px + var(--safe-bottom));}
.modal-sheet.dialog{border-radius:var(--radius-lg);margin:20px;align-self:center;max-height:80vh;}
.modal-title{font-size:17px;font-weight:800;margin-bottom:16px;}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-sec);}

/* ─── SORT DIALOG ─── */
.radio-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.radio-row:last-of-type{border:none;}
.radio-outer{width:22px;height:22px;border-radius:50%;border:2px solid var(--text-light);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.radio-outer.sel{border-color:var(--primary);}
.radio-inner{width:11px;height:11px;border-radius:50%;background:var(--primary);}
.radio-label{font-size:14px;font-weight:600;}
.select-btn{display:block;margin-left:auto;padding:10px 16px;color:var(--primary);font-weight:700;font-size:14px;background:none;border:none;cursor:pointer;font-family:var(--font);}

/* ─── ADD TASK SCREEN ─── */
.add-header{display:flex;align-items:center;padding:14px 16px;gap:12px;flex-shrink:0;}
.add-header h2{flex:1;font-size:17px;font-weight:800;}
.text-btn{background:none;border:none;cursor:pointer;font-family:var(--font);font-size:15px;font-weight:700;padding:6px;}
.text-btn.primary{color:var(--primary);}
.text-btn.muted{color:var(--text-sec);}
.add-card{background:var(--surface);margin:0 16px 12px;border-radius:var(--radius-md);padding:16px;box-shadow:var(--shadow-sm);}
.add-title-input{width:100%;border:none;outline:none;font-size:18px;font-weight:700;font-family:var(--font);color:var(--text);margin-bottom:8px;}
.add-desc-input{width:100%;border:none;outline:none;font-size:14px;font-family:var(--font);color:var(--text-sec);resize:none;min-height:40px;}
.field-row{display:flex;align-items:center;padding:13px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.field-row:last-child{border:none;}
.field-icon{font-size:18px;width:28px;}
.field-label{flex:1;font-size:15px;font-weight:600;margin-left:8px;}
.field-value{font-size:14px;color:var(--text-sec);font-weight:600;}
.sub-header-row{font-size:12px;font-weight:700;color:var(--text-sec);text-transform:uppercase;letter-spacing:.5px;padding:12px 0 8px;}
.subtask-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.subtask-cb{width:20px;height:20px;border-radius:4px;border:2px solid var(--text-light);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.subtask-title{flex:1;font-size:14px;font-weight:600;}
.subtask-del{background:none;border:none;font-size:16px;color:var(--text-light);cursor:pointer;}
.add-sub-row{display:flex;align-items:center;gap:8px;padding:10px 0;}
.add-sub-input{flex:1;border:none;outline:none;font-size:14px;font-family:var(--font);color:var(--text);}
.add-sub-btn{background:none;border:none;font-size:24px;color:var(--primary);cursor:pointer;font-weight:300;line-height:1;}
.del-btn{display:block;width:calc(100% - 32px);margin:8px 16px;padding:14px;background:#FEE2E2;border:none;border-radius:var(--radius-md);color:var(--red);font-weight:700;font-size:15px;cursor:pointer;font-family:var(--font);}

/* ─── CALENDAR ─── */
.cal-nav{display:flex;align-items:center;padding:12px 16px 4px;}
.cal-nav h2{flex:1;font-size:17px;font-weight:800;}
.cal-nav-btn{background:none;border:none;font-size:26px;cursor:pointer;padding:4px 8px;color:var(--text);font-weight:300;}
.day-headers{display:grid;grid-template-columns:repeat(7,1fr);padding:0 8px;}
.day-hdr{text-align:center;font-size:11px;font-weight:700;color:var(--text-sec);padding:6px 0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);padding:0 8px;}
.cal-day{display:flex;flex-direction:column;align-items:center;padding:4px 0;cursor:pointer;}
.day-num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;}
.cal-day.other-month .day-num{color:var(--text-light);}
.cal-day.today .day-num{color:var(--primary);font-weight:800;}
.cal-day.selected .day-num{background:var(--primary);color:#fff;}
.cal-task-dot{width:5px;height:5px;border-radius:50%;background:var(--primary);margin-top:2px;}

/* ─── MINE (STATS) ─── */
.mine-scroll{flex:1;overflow-y:auto;padding:0 16px 20px;}
.profile-row{display:flex;align-items:center;gap:14px;padding:16px 0;}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;}
.streak-text{font-size:14px;font-weight:700;}
.login-text{font-size:12px;color:var(--text-sec);margin-top:2px;}
.summary-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.summary-card{background:var(--surface);border-radius:var(--radius-md);padding:18px;box-shadow:var(--shadow-sm);text-align:center;}
.summary-num{font-size:36px;font-weight:800;}
.summary-label{font-size:12px;color:var(--text-sec);margin-top:4px;font-weight:600;}
.chart-card{background:var(--surface);border-radius:var(--radius-md);padding:16px;box-shadow:var(--shadow-sm);margin-bottom:14px;}
.chart-title{font-size:14px;font-weight:700;margin-bottom:12px;}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:80px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;}
.bar-track{flex:1;display:flex;flex-direction:column;justify-content:flex-end;width:100%;}
.bar-fill{background:var(--primary);border-radius:4px 4px 0 0;width:100%;transition:height .3s;}
.bar-lbl{font-size:9px;color:var(--text-sec);font-weight:600;}
.stat-card{background:var(--surface);border-radius:var(--radius-md);padding:16px;box-shadow:var(--shadow-sm);margin-bottom:14px;}
.stat-card-title{font-size:14px;font-weight:700;}

/* ─── SETTINGS ─── */
.settings-scroll{flex:1;overflow-y:auto;}
.settings-section{font-size:12px;font-weight:700;color:var(--text-sec);text-transform:uppercase;letter-spacing:.5px;padding:14px 16px 6px;background:var(--bg);}
.settings-row{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--surface);gap:14px;cursor:pointer;}
.settings-row:active{background:var(--primary-light);}
.s-icon{font-size:19px;width:26px;text-align:center;}
.s-body{flex:1;}
.s-label{font-size:15px;font-weight:600;}
.s-sub{font-size:13px;color:var(--text-sec);margin-top:2px;}
/* toggle */
.toggle{width:48px;height:26px;border-radius:13px;background:var(--border);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;border:none;}
.toggle.on{background:var(--primary);}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s;}
.toggle.on::after{left:25px;}

/* ─── MANAGE CATEGORIES ─── */
.cat-hint{background:var(--primary-light);padding:10px 16px;font-size:13px;color:var(--primary);font-weight:600;text-align:center;}
.cat-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--surface);}
.cat-dot-sm{width:12px;height:12px;border-radius:50%;}
.cat-name{flex:1;font-size:15px;font-weight:600;}
.cat-cnt{font-size:14px;color:var(--text-sec);}
.cat-more{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-sec);padding:4px;}
.cat-add-row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface);cursor:pointer;}
.cat-add-row span{font-size:20px;color:var(--primary);}
.cat-add-label{font-size:15px;color:var(--primary);font-weight:700;}

/* ─── THEME SCREEN ─── */
.theme-scroll{flex:1;overflow-y:auto;padding:0 16px 30px;}
.theme-section{font-size:15px;font-weight:800;margin:20px 0 12px;}
.theme-sec-row{display:flex;align-items:center;gap:8px;margin:20px 0 12px;}
.color-grid{display:flex;flex-wrap:wrap;gap:12px;}
.color-swatch{width:72px;height:72px;border-radius:16px;cursor:pointer;position:relative;transition:transform .15s;}
.color-swatch:active{transform:scale(.93);}
.swatch-check{position:absolute;bottom:8px;left:8px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:700;}
.premium-grid{background:rgba(0,0,0,.04);border-radius:var(--radius-md);padding:12px;display:flex;flex-wrap:wrap;gap:12px;position:relative;}
.premium-badge{position:absolute;bottom:8px;right:8px;font-size:18px;}
.texture-grid{display:flex;gap:12px;}
.texture-card{width:72px;height:72px;border-radius:16px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;}
.texture-dot{width:14px;height:14px;border-radius:50%;}
.landscape-grid{display:flex;flex-wrap:wrap;gap:12px;}
.landscape-card{flex:1;min-width:140px;height:90px;border-radius:var(--radius-md);background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:36px;}

/* ─── PICKERS ─── */
.flag-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;}
.flag-swatch{width:42px;height:42px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:transform .15s;}
.flag-swatch:active{transform:scale(.9);}
.flag-swatch.sel{outline:3px solid var(--text);outline-offset:2px;}
.color-pick-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
.cpick{width:36px;height:36px;border-radius:50%;cursor:pointer;transition:transform .15s;}
.cpick:active{transform:scale(.9);}
.cpick.sel{outline:3px solid var(--text);outline-offset:2px;}

/* ─── BULK BAR ─── */
.bulk-bar{display:flex;background:var(--surface);border-top:1px solid var(--border);padding:12px 0 calc(12px + var(--safe-bottom));}
.bulk-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;border:none;background:none;font-size:11px;color:var(--text-sec);font-family:var(--font);font-weight:700;}
.bulk-btn .bi{font-size:22px;}

/* ─── TASK DETAIL ─── */
.detail-scroll{flex:1;overflow-y:auto;padding:0 0 20px;}
.detail-card{background:var(--surface);margin:0 16px 12px;border-radius:var(--radius-md);padding:20px;box-shadow:var(--shadow-sm);}
.detail-title-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;}
.detail-circle{width:28px;height:28px;border-radius:50%;border:2px solid var(--text-light);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;margin-top:2px;}
.detail-circle.done{background:var(--text-light);border-color:var(--text-light);color:#fff;font-size:14px;}
.detail-title{font-size:20px;font-weight:800;flex:1;line-height:1.3;}
.detail-title.done{text-decoration:line-through;color:var(--text-sec);}
.detail-desc{font-size:14px;color:var(--text-sec);line-height:1.6;margin-bottom:12px;}
.detail-meta{border-top:1px solid var(--border);padding-top:12px;}
.meta-row{display:flex;align-items:center;gap:10px;padding:8px 0;}
.meta-icon{font-size:16px;}
.meta-text{font-size:14px;color:var(--text-sec);font-weight:600;}

/* ─── ANIMATIONS ─── */
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.slide-up{animation:slideUp .2s ease-out;}
.fade-in{animation:fadeIn .15s ease-out;}

/* context menu */
.ctx-menu{position:fixed;background:var(--surface);border-radius:var(--radius-md);box-shadow:var(--shadow-md);z-index:300;min-width:160px;display:none;overflow:hidden;}
.ctx-menu.open{display:block;}
.ctx-item{padding:14px 20px;font-size:15px;font-weight:600;cursor:pointer;border-bottom:1px solid var(--border);}
.ctx-item:last-child{border:none;}
.ctx-item:active{background:var(--primary-light);}
.ctx-item.danger{color:var(--red);}
</style>
</head>
<body>
<div id="app">

  <!-- ═══════════════════════════════════════ TASKS SCREEN -->
  <div id="screen-tasks" class="screen active">
    <div class="top-bar" id="tasks-header">
      <button class="icon-btn" id="drawer-btn">☰</button>

const DEFAULT_CATEGORIES = [
  {id:'work', nameKey:'work', color:'#6B8DD6', isDefault:true},
  {id:'personal', nameKey:'personal', color:'#6B8DD6', isDefault:true},
  {id:'wishlist', nameKey:'wishlist', color:'#6B8DD6', isDefault:true},
  {id:'birthdays', nameKey:'birthdays', color:'#6B8DD6', isDefault:true},
];
const FREE_COLORS = ['#6B8DD6','#E88FAD','#3ABFBF','#2D2D3A'];
const PREMIUM_COLORS = ['#E05C5C','#F5B731','#3AB795','#F08A3C','#9B6DD6'];
const FLAG_COLORS = ['#6B8DD6','#E05C5C','#F08A3C','#F5B731','#3AB795','#9B6DD6'];
const CAT_PALETTE = ['#6B8DD6','#E88FAD','#3ABFBF','#E05C5C','#F5B731','#3AB795','#F08A3C','#9B6DD6','#2D2D3A'];

let state = load();

function load() {
  try {
    const saved = localStorage.getItem('todo_state');
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  return {
    lang: 'es',
    tasks: [],
    categories: JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)),
    sortOrder: 'byDueDate',
    settings: {
      taskCompletionRingtone: true,
      autoCompleteSubtasks: true,
      syncCalendar: false,
      smartInput: false,
    },
    theme: {type:'color', value:'#6B8DD6'},
  };
}

function persist() {
  localStorage.setItem('todo_state', JSON.stringify(state));
}

function t(key, vars={}) {
  let s = TR[state.lang]?.[key] || TR.es[key] || key;
  Object.entries(vars).forEach(([k,v]) => s = s.replace(`{${k}}`, v));
  return s;
}

function catName(cat) {
  return cat.nameKey ? t(cat.nameKey) : (cat.name || cat.id);
}

// ════════════════════════════════════════════
// NAVIGATION
// ════════════════════════════════════════════
let currentScreen = 'tasks';
let currentTab = 'tasks';

function showScreen(id, pushHistory=true) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  currentScreen = id;
  // Show/hide bottom nav & FABs
  const mainScreens = ['tasks','calendar','mine'];
  const isMain = mainScreens.includes(id);
  document.getElementById('bottom-nav').style.display = isMain ? 'flex' : 'none';
  if (isMain) {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.screen === id));
  }
}

function goBack() {
  showScreen(currentTab);
}

    const btn = document.createElement('button');
    btn.className = 'chip' + (cat.id === activeCat ? ' active' : '');
    btn.textContent = catName(cat);
    btn.onclick = () => { activeCat = cat.id; renderChips(); renderTaskList(); };
    chips.appendChild(btn);
  });
}

function sortedTasks(list) {
  const s = [...list];
  switch(state.sortOrder) {
    case 'byDueDate': return s.sort((a,b) => {
      if (!a.dueDate && !b.dueDate) return 0;
      if (!a.dueDate) return 1; if (!b.dueDate) return -1;
      return new Date(a.dueDate) - new Date(b.dueDate);
    });
    case 'byCreationOldest': return s.sort((a,b) => new Date(a.createdAt)-new Date(b.createdAt));
    case 'byCreationNewest': return s.sort((a,b) => new Date(b.createdAt)-new Date(a.createdAt));
    case 'alphabeticalAZ': return s.sort((a,b) => a.title.localeCompare(b.title));
    case 'alphabeticalZA': return s.sort((a,b) => b.title.localeCompare(a.title));
    default: return s;
  }
}

function filteredTasks() {
  let list = state.tasks;
  if (activeCat !== 'all') list = list.filter(tk => tk.categoryId === activeCat);
  if (searchMode && searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(tk => tk.title.toLowerCase().includes(q));
  }
  return sortedTasks(list);
}

function renderTaskList() {
  const el = document.getElementById('task-list');
  el.innerHTML = '';
  const all = filteredTasks();
  const pending = all.filter(t => !t.completed);
  const done = all.filter(t => t.completed);

  if (pending.length === 0 && done.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = `<div class="empty-emoji">🎂</div><div class="empty-title">${t('noTasksInCategory')}</div><div class="empty-sub">${t('clickPlusToCreate')}</div>`;
    el.appendChild(empty);
    return;
  }

  pending.forEach(task => el.appendChild(makeTaskEl(task)));

  if (done.length > 0) {
    const secLabel = document.createElement('div');
    secLabel.className = 'section-label';
    secLabel.innerHTML = `<span>${t('completedToday')}</span><span class="chevron">${showCompleted ? '▲' : '▼'}</span>`;
    secLabel.onclick = () => { showCompleted = !showCompleted; renderTaskList(); };
    el.appendChild(secLabel);
    if (showCompleted) done.forEach(task => el.appendChild(makeTaskEl(task)));
  }
}

function makeTaskEl(task) {
  const div = document.createElement('div');
  div.className = 'task-item' + (task.completed ? ' completed' : '');

  if (selectMode) {
    const cb = document.createElement('div');
    cb.className = 'task-cb' + (selectedIds.has(task.id) ? ' checked' : '');
    cb.innerHTML = selectedIds.has(task.id) ? '✓' : '';
    cb.onclick = (e) => { e.stopPropagation(); toggleSelect(task.id); };
    div.appendChild(cb);
  } else {
    const circle = document.createElement('div');
    circle.className = 'task-check' + (task.completed ? ' done' : '');
    circle.innerHTML = task.completed ? '✓' : '';
    circle.onclick = (e) => { e.stopPropagation(); toggleTask(task.id); };
    div.appendChild(circle);
  }

  const body = document.createElement('div');
  body.className = 'task-body';
  body.innerHTML = `<div class="task-title">${esc(task.title)}</div>${task.dueDate ? `<div class="task-due">${formatDate(task.dueDate)}</div>` : ''}`;
  body.onclick = () => selectMode ? toggleSelect(task.id) : openDetail(task.id);
  div.appendChild(body);

  const flag = document.createElement('div');
  flag.className = 'task-flag' + (task.flagged ? ' flagged' : '');
  flag.style.color = task.flagged && task.flagColor ? task.flagColor : '';
  flag.innerHTML = '⚑';
  flag.onclick = (e) => { e.stopPropagation(); };
  div.appendChild(flag);

  div.addEventListener('longpress', () => { if (!selectMode) enterSelectMode(task.id); });
  addLongPress(div, () => { if (!selectMode) enterSelectMode(task.id); });
  return div;
}

function addLongPress(el, cb) {
  let timer;
  el.addEventListener('touchstart', () => { timer = setTimeout(cb, 500); }, {passive:true});
  el.addEventListener('touchend', () => clearTimeout(timer), {passive:true});
  el.addEventListener('touchmove', () => clearTimeout(timer), {passive:true});
}

function toggleTask(id) {
  const task = state.tasks.find(t => t.id === id);
  if (!task) return;
  task.completed = !task.completed;
  task.completedAt = task.completed ? new Date().toISOString() : null;
  if (state.settings.autoCompleteSubtasks && task.completed)
    task.subTasks?.forEach(s => s.completed = true);
  persist();
  renderTaskList();
  updateMine();
}

function renderSubtaskList() {

document.getElementById('add-subtask-btn').onclick = () => {

  if (!inp.value.trim()) return;
  if (!taskForm.subTasks) taskForm.subTasks = [];
  taskForm.subTasks.push({id:Date.now().toString(), title:inp.value.trim(), completed:false});
  inp.value = '';
  renderSubtaskList();
};

document.getElementById('add-cancel').onclick = goBack;

document.getElementById('add-save').onclick = () => {
  taskForm.title = document.getElementById('task-title-input').value.trim();
  taskForm.description = document.getElementById('task-desc-input').value.trim();
  if (!taskForm.title) return;
  if (editingTaskId) {
    const idx = state.tasks.findIndex(t => t.id === editingTaskId);
    if (idx !== -1) state.tasks[idx] = {...state.tasks[idx], ...taskForm};
  } else {
    state.tasks.push({id:Date.now().toString(), createdAt:new Date().toISOString(), completed:false, completedAt:null, ...taskForm});
  }
  persist(); goBack(); renderTaskList(); renderCalendar(); updateMine();
};

document.getElementById('task-delete-btn').onclick = () => {

// CALENDAR
// ════════════════════════════════════════════
let calViewDate = new Date();
calViewDate.setDate(1);
let calSelected = new Date();

document.getElementById('cal-prev').onclick = () => { calViewDate.setMonth(calViewDate.getMonth()-1); renderCalendar(); };
document.getElementById('cal-next').onclick = () => { calViewDate.setMonth(calViewDate.getMonth()+1); renderCalendar(); };
document.getElementById('fab-cal').onclick = () => openAddTask(null, {dueDate: calSelected.toISOString()});

function renderCalendar() {
  const months = t('months');
  document.getElementById('cal-month-title').textContent = `${months[calViewDate.getMonth()]}, ${calViewDate.getFullYear()}`;
  const days = t('days');
  const dayHdrs = document.getElementById('cal-day-headers');
  dayHdrs.innerHTML = '';
  days.forEach(d => { const el=document.createElement('div'); el.className='day-hdr'; el.textContent=d; dayHdrs.appendChild(el); });

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  const year = calViewDate.getFullYear(), month = calViewDate.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrev = new Date(year, month, 0).getDate();

  const cells = [];
  for (let i=firstDay-1; i>=0; i--) cells.push({day:daysInPrev-i, thisMonth:false, date:new Date(year,month-1,daysInPrev-i)});
  for (let d=1; d<=daysInMonth; d++) cells.push({day:d, thisMonth:true, date:new Date(year,month,d)});
  const rem = 42 - cells.length;
  for (let d=1; d<=rem; d++) cells.push({day:d, thisMonth:false, date:new Date(year,month+1,d)});

  // Task dates set
  const taskDates = new Set();
  state.tasks.forEach(tk => { if(tk.dueDate){ const d=new Date(tk.dueDate); taskDates.add(`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`); } });
  const today = new Date();

  cells.forEach(cell => {
    const div = document.createElement('div');
    div.className = 'cal-day' + (!cell.thisMonth?' other-month':'') +
      (isDateToday(cell.date,today)?' today':'') +
      (isSameDate(cell.date,calSelected)?' selected':'');
    const numEl = document.createElement('div');
    numEl.className = 'day-num';
    numEl.textContent = cell.day;
    div.appendChild(numEl);
    const key = `${cell.date.getFullYear()}-${cell.date.getMonth()}-${cell.date.getDate()}`;
    if (taskDates.has(key)) { const dot=document.createElement('div'); dot.className='cal-task-dot'; div.appendChild(dot); }
    if (cell.thisMonth) div.onclick = () => { calSelected=cell.date; renderCalendar(); renderCalTaskList(); };
    grid.appendChild(div);
  });

  renderCalTaskList();
}

function renderCalTaskList() {
  const el = document.getElementById('cal-task-list');
  el.innerHTML = '';
  const sel = new Date(calSelected); sel.setHours(0,0,0,0);
  const next = new Date(sel); next.setDate(next.getDate()+1);
  const dayTasks = state.tasks.filter(tk => {
    if (!tk.dueDate) return false;
    const d = new Date(tk.dueDate);
    return d >= sel && d < next;
  });
  if (dayTasks.length === 0) {
    const p = document.createElement('p');
    p.style.cssText = 'text-align:center;color:var(--text-light);padding:20px;font-weight:600';
    p.textContent = '—';
    el.appendChild(p);
    return;
  }
  dayTasks.forEach(task => {
    const div = makeTaskEl(task);
    el.appendChild(div);
  });
}

function isDateToday(d, today) { return d.getFullYear()===today.getFullYear()&&d.getMonth()===today.getMonth()&&d.getDate()===today.getDate(); }
function isSameDate(a,b) { return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }

// ════════════════════════════════════════════
// MINE
// ════════════════════════════════════════════
function updateMine() {
  const completed = state.tasks.filter(t => t.completed).length;
  const pending = state.tasks.filter(t => !t.completed).length;
  document.getElementById('mine-title').textContent = t('mine');
  document.getElementById('stat-completed').textContent = completed;
  document.getElementById('stat-pending').textContent = pending;
  document.getElementById('stat-completed-lbl').textContent = t('completedTasks');
  document.getElementById('stat-pending-lbl').textContent = t('pendingTasks');
  document.getElementById('chart-title').textContent = t('dailyCompletion');
  document.getElementById('next7-title').textContent = t('tasksNext7Days');
  document.getElementById('unfinished-title').textContent = t('unfinishedTasks');

  // Streak
  const today = new Date(); today.setHours(0,0,0,0);
  let streak = 0;
  for (let i=0; i<365; i++) {
    const d = new Date(today); d.setDate(d.getDate()-i);
    const next = new Date(d); next.setDate(next.getDate()+1);
    const hasCompleted = state.tasks.some(tk => { if(!tk.completedAt) return false; const ca=new Date(tk.completedAt); return ca>=d&&ca<next; });
    if (hasCompleted) streak++; else break;
  }
  document.getElementById('streak-text').textContent = t('stayedOnPlan', {d:streak});
  document.getElementById('login-text').textContent = t('clickToLogin');

  // Bar chart
  const chart = document.getElementById('bar-chart');
  chart.innerHTML = '';
  const days = t('days');
  for (let i=6; i>=0; i--) {
    const d = new Date(today); d.setDate(d.getDate()-i);
    const next = new Date(d); next.setDate(next.getDate()+1);
    const count = state.tasks.filter(tk => { if(!tk.completedAt) return false; const ca=new Date(tk.completedAt); return ca>=d&&ca<next; }).length;
    const col = document.createElement('div');
    col.className = 'bar-col';
    const maxH = 70;
    const maxCount = Math.max(...[0,1,2,3,4,5,6].map(j => {
      const dj=new Date(today); dj.setDate(dj.getDate()-(6-j));
      const nj=new Date(dj); nj.setDate(nj.getDate()+1);
      return state.tasks.filter(tk=>tk.completedAt&&new Date(tk.completedAt)>=dj&&new Date(tk.completedAt)<nj).length;
    }), 1);
    const h = (count/maxCount)*maxH;
    col.innerHTML = `<div class="bar-track"><div class="bar-fill" style="height:${h}px"></div></div><span class="bar-lbl">${days[d.getDay()]}</span>`;
    chart.appendChild(col);
  }
}

// ════════════════════════════════════════════
// DRAWER
// ════════════════════════════════════════════
function openDrawer() {
  renderDrawer();
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer-overlay').classList.add('open');
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer-overlay').classList.remove('open');
}
document.getElementById('drawer-overlay').onclick = closeDrawer;

function renderDrawer() {
  const body = document.getElementById('drawer-body');
  body.innerHTML = '';
  const catHdr = document.createElement('div');
  catHdr.className = 'drawer-cat-header';
  catHdr.innerHTML = `<span>⊞</span><span>${t('category')}</span><span style="margin-left:auto">▲</span>`;
  body.appendChild(catHdr);
  [{id:'all',nameKey:'all'}, ...state.categories].forEach(cat => {
    const item = document.createElement('div');
    item.className = 'drawer-item';
    const count = cat.id==='all' ? state.tasks.filter(t=>!t.completed).length : state.tasks.filter(t=>t.categoryId===cat.id&&!t.completed).length;
    item.innerHTML = `<span class="di-icon">☰</span><span>${catName(cat)}</span><span class="di-count">${count}</span>`;
    item.onclick = () => { activeCat=cat.id; closeDrawer(); renderChips(); renderTaskList(); showScreen('tasks'); currentTab='tasks'; };
    body.appendChild(item);
  });
  const drawerItems = [
    {icon:'➕', label:t('createNew'), action:()=>{closeDrawer();openCats();}},
    {icon:'🎨', label:t('theme'), action:()=>{closeDrawer();openTheme();}},
    {icon:'🗂', label:t('widget'), action:()=>{}},
    {icon:'❓', label:t('faq'), action:()=>{}},
    {icon:'💬', label:t('comments'), action:()=>{}},
    {icon:'👥', label:t('followUs'), action:()=>{}},
    {icon:'❤️', label:t('donate'), action:()=>{}},
    {icon:'⊞', label:t('familyApps'), action:()=>{}},
    {icon:'⚙️', label:t('settings'), action:()=>{closeDrawer();openSettings();}},
  ];
  drawerItems.forEach(it => {
    const item = document.createElement('div');
    item.className = 'drawer-item';
    item.innerHTML = `<span class="di-icon">${it.icon}</span><span>${it.label}</span>`;
    item.onclick = it.action;
    body.appendChild(item);
  });
}

// ════════════════════════════════════════════
// MANAGE CATEGORIES
// ════════════════════════════════════════════
let editingCatId = null;
let editingCatColor = CAT_PALETTE[0];

function openCats() {
  renderCats();
  showScreen('cats');
}

function renderCats() {
  document.getElementById('cats-title').textContent = t('manageCategories');
  document.getElementById('cats-hint').textContent = t('categoriesShownOnHome');
  document.getElementById('cat-add-label').textContent = t('createNew');
  document.getElementById('cats-drag-hint').textContent = t('holdToDrag');
  const el = document.getElementById('cats-list');
  el.innerHTML = '';
  state.categories.forEach(cat => {
    const count = state.tasks.filter(tk => tk.categoryId===cat.id).length;
    const row = document.createElement('div');
    row.className = 'cat-row';
    row.innerHTML = `<div class="cat-dot-sm" style="background:${cat.color}"></div><span class="cat-name">${catName(cat)}</span><span class="cat-cnt">${count}</span><button class="cat-more">⋮</button>`;
    row.querySelector('.cat-more').onclick = (e) => { e.stopPropagation(); openCtxMenu(e, cat); };
    el.appendChild(row);
  });
}

document.getElementById('cats-back').onclick = goBack;
document.getElementById('cat-add-row').onclick = () => openCatEdit(null);

function openCtxMenu(e, cat) {
  editingCatId = cat.id;
  const menu = document.getElementById('ctx-menu');
  document.getElementById('ctx-edit').textContent = t('edit');
  document.getElementById('ctx-delete').textContent = t('delete');
  menu.style.top = (e.pageY - 20) + 'px';
  menu.style.right = '16px';
  menu.classList.add('open');
  document.getElementById('ctx-overlay').style.display = 'block';
}

document.getElementById('ctx-overlay').onclick = closeCtxMenu;
function closeCtxMenu() { document.getElementById('ctx-menu').classList.remove('open'); document.getElementById('ctx-overlay').style.display='none'; }

document.getElementById('ctx-edit').onclick = () => {
  closeCtxMenu();
  const cat = state.categories.find(c=>c.id===editingCatId);
  if (cat) openCatEdit(cat);
};
document.getElementById('ctx-delete').onclick = () => {
  closeCtxMenu();
  if (!confirm(t('delete')+'?')) return;
  state.categories = state.categories.filter(c=>c.id!==editingCatId);
  state.tasks.forEach(tk => { if(tk.categoryId===editingCatId) tk.categoryId=null; });
  persist(); renderCats(); renderChips(); renderTaskList();
};

function openCatEdit(cat) {
  editingCatId = cat ? cat.id : null;
  editingCatColor = cat ? cat.color : CAT_PALETTE[0];
  document.getElementById('cat-edit-title').textContent = cat ? t('edit') : t('createNew');
  document.getElementById('cat-name-input').value = cat ? (cat.name || (cat.nameKey ? t(cat.nameKey) : '')) : '';
  document.getElementById('cat-edit-cancel').textContent = t('cancel');
  document.getElementById('cat-edit-save').textContent = t('save');
  const grid = document.getElementById('cat-color-grid');
  grid.innerHTML = '';
  CAT_PALETTE.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'cpick' + (editingCatColor===c?' sel':'');
    sw.style.background = c;
    sw.onclick = () => { editingCatColor=c; grid.querySelectorAll('.cpick').forEach(x=>x.classList.remove('sel')); sw.classList.add('sel'); };
    grid.appendChild(sw);
  });
  openModal('cat-edit-modal');
}

document.getElementById('cat-edit-cancel').onclick = () => closeModal('cat-edit-modal');
document.getElementById('cat-edit-save').onclick = () => {
  const name = document.getElementById('cat-name-input').value.trim();
  if (!name) return;
  if (editingCatId) {
    const cat = state.categories.find(c=>c.id===editingCatId);
    if (cat) { cat.name=name; cat.nameKey=null; cat.color=editingCatColor; }
  } else {
    state.categories.push({id:Date.now().toString(), name, color:editingCatColor, isDefault:false});
  }
  persist(); closeModal('cat-edit-modal'); renderCats(); renderChips();
};

// THEME
// ════════════════════════════════════════════
function openTheme() {
  renderTheme();
  showScreen('theme');
}

function renderTheme() {
  document.getElementById('theme-title').textContent = t('theme');
  document.getElementById('theme-pure-label').textContent = t('pureColor');
  document.getElementById('theme-texture-label').textContent = t('texture');
  document.getElementById('theme-landscape-label').textContent = t('landscape');

  const fc = document.getElementById('free-colors');
  fc.innerHTML = '';
  FREE_COLORS.forEach(c => {
    const sw = makeColorSwatch(c, false);
    fc.appendChild(sw);
  });

  const pc = document.getElementById('premium-colors');
  // keep the crown badge
  const badge = pc.querySelector('.premium-badge');
  pc.innerHTML = '';
  pc.appendChild(badge);
  PREMIUM_COLORS.forEach(c => {
    const sw = makeColorSwatch(c, true);
    pc.insertBefore(sw, badge);
  });
}

function makeColorSwatch(color, premium) {
  const sw = document.createElement('div');
  sw.className = 'color-swatch';
  sw.style.background = color;
  const isSel = state.theme.type==='color' && state.theme.value===color;
  if (isSel) sw.innerHTML = '<div class="swatch-check">✓</div>';
  sw.onclick = () => {
    state.theme = {type:'color', value:color};
    document.documentElement.style.setProperty('--primary', color);
    persist(); renderTheme();
  };
  return sw;
}

document.getElementById('theme-back').onclick = goBack;

      {icon:'👤', label:t('accountSync')},
      {icon:'🗂', label:t('widget')},
      {icon:'🔔', label:t('notificationReminder')},
      {icon:'🎨', label:t('theme'), action:openTheme},
      {icon:'📅', label:t('syncCalendar'), sub:state.settings.syncCalendar?'On':t('no'), toggle:true, key:'syncCalendar'},
      {icon:'✨', label:t('smartInput'), toggle:true, key:'smartInput'},
      {icon:'🎵', label:t('taskCompletionRingtone'), toggle:true, key:'taskCompletionRingtone'},
      {icon:'📋', label:t('autoCompleteSubtasks'), toggle:true, key:'autoCompleteSubtasks'},
    ]},
    { title: t('dateAndTime'), rows: [
      {icon:'🗓', label:t('firstDayOfWeek'), sub:t('systemDefault')},
      {icon:'🕐', label:t('timeFormat'), sub:t('systemDefault')},
      {icon:'📆', label:t('dateFormat'), sub:new Date().toISOString().slice(0,10).replace(/-/g,'/')},
      {icon:'📅', label:t('defaultDueDate'), sub:t('today')},
      {icon:'🔔', label:t('defaultReminder'), sub:t('minutesBefore',{n:5})},
    ]},
    { title: t('taskAppearance'), rows: [
      {icon:'☰', label:t('defaultHomeView'), sub:t('tasksView')},
      {icon:'⊞', label:t('defaultCategory'), sub:t('lastView')},
      {icon:'↕', label:t('timeRangeOrder'), sub:t('pastTodayFuture')},
    ]},
    { title: t('information'), rows: [
      {icon:'🌐', label:t('language'), sub:state.lang==='es'?'Español':'English', action:()=>{state.lang=state.lang==='es'?'en':'es'; persist(); initAll();}},
      {icon:'🔤', label:t('helpTranslate')},
      {icon:'❓', label:t('faq')},
      {icon:'💬', label:t('feedback')},
      {icon:'↗', label:t('shareApp')},
      {icon:'👥', label:t('followUs')},
      {icon:'🔒', label:t('privacyPolicy')},
      {icon:'ℹ', label:t('version')},
    ]},
  ];

  sections.forEach(sec => {
    const secEl = document.createElement('div');
    secEl.className = 'settings-section';
    secEl.textContent = sec.title;
    body.appendChild(secEl);
    sec.rows.forEach(row => {
      const el = document.createElement('div');
      el.className = 'settings-row';
      el.innerHTML = `<span class="s-icon">${row.icon}</span><div class="s-body"><div class="s-label">${row.label}</div>${row.sub?`<div class="s-sub">${row.sub}</div>`:''}</div>`;
      if (row.toggle) {
        const btn = document.createElement('button');

document.querySelectorAll('.nav-btn').forEach(btn => {

document.addEventListener('click', (e) => {

  if (menu.classList.contains('open') && !menu.contains(e.target)) closeOverflow();
});

function esc(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function formatDate(iso) {
  const d = new Date(iso);
  return `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
